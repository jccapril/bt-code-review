name: Publish npm tarball
on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  release:
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify version and test
        run: |
          test "v$(node -p "require('./package.json').version")" = "$GITHUB_REF_NAME"
          go test ./...
      - name: Pack and verify CLI
        run: |
          npm pack
          npm install --global --prefix "$RUNNER_TEMP/btcr" ./bt-code-review-*.tgz
          test "$("$RUNNER_TEMP/btcr/bin/btcr" --version)" = "btcr ${GITHUB_REF_NAME#v}"
      - name: Publish archive
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" ./bt-code-review-*.tgz \
            --verify-tag --title "btcr $GITHUB_REF_NAME" --generate-notes
